# Build-script approvals (moved out of package.json).
# sharp: native image binary used by Next.js image optimization.
# unrs-resolver: native resolver used by the ESLint import plugin.
# core-js: postinstall only prints a donation banner — not needed.
allowBuilds:
  sharp: true
  unrs-resolver: true
  core-js: false
# Force patched transitive versions to clear security advisories.
# axios/form-data arrive via @sendgrid/mail > @sendgrid/client > axios.
# postcss arrives via next (which pins 8.4.31); >=8.5.23 clears the
# sourceMappingURL path-traversal pair GHSA-r28c-9q8g-f849 + GHSA-fxqj-rqcc-2cmp.
# sharp arrives via next as an OPTIONAL dep declared '^0.34.5', which excludes
# 0.35.x — so this override deliberately steps outside Next's tested range to
# clear the inherited libvips CVEs (GHSA-f88m-g3jw-g9cj). Image optimization is
# verified against this pin; re-check /_next/image after any Next upgrade.
overrides:
  axios: '>=1.16.0'
  form-data: '>=4.0.6'
  postcss: '>=8.5.23'
  sharp: '>=0.35.0'
